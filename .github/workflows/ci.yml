# CI mínimo: typecheck + testes em cada push/PR.
# Pega a classe de erro mais provável ANTES do deploy da Vercel — que até aqui
# era a única validação (e só rodava depois do push).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 é o mínimo: os testes usam fs.globSync, que não existe no 20.
          # Com o 20 aqui, todo run falhou de agosto a novembro de 2026.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
